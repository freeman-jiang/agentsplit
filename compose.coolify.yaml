# AgentSplit on Coolify, kept in maintenance mode only for a rollback to it
# (DEPLOYMENT.md, "Previous hosting: Coolify"). Coolify's standard Traefik
# proxy and external `coolify` network are required; Coolify routes the app's
# domain to `app`.
# Set the variables in coolify.env.example in the resource's environment settings.
#
# `db2` holds the ledger and `garage` the receipts. `db` is the pre-cutover
# PostgreSQL 17 database of the old app. Nothing reads it; it stays for
# rollback until its removal, which Freeman approved for 2026-11-13 (DEPLOYMENT.md).
services:
  app:
    build:
      context: .
    expose:
      - '3000'
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL}
      DATABASE_URL: postgresql://postgres:${DB2_PASSWORD:?Set DB2_PASSWORD}@agentsplit-db2:5432/agentsplit
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      # The maintenance switch: 503 for everything but the health checks (DEPLOYMENT.md).
      AGENTSPLIT_MAINTENANCE: ${AGENTSPLIT_MAINTENANCE:-}
      # New accounts per 24 hours; empty means 200 (src/shared/limits.ts).
      SIGN_UP_DAILY_LIMIT: ${SIGN_UP_DAILY_LIMIT:-}
      # Garage's S3 API on the internal network. The app streams every
      # receipt itself, so no browser or agent talks to storage.
      S3_UPLOAD_ENDPOINT: http://agentsplit-garage:3900
      S3_UPLOAD_BUCKET: agentsplit-receipts
      S3_UPLOAD_REGION: garage
      S3_UPLOAD_KEY: ${S3_UPLOAD_KEY:?Set S3_UPLOAD_KEY}
      S3_UPLOAD_SECRET: ${S3_UPLOAD_SECRET:?Set S3_UPLOAD_SECRET}
    depends_on:
      db2:
        condition: service_healthy
      garage:
        condition: service_healthy
    # The image has the same check; this copy also works for images built without Docker's format.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # The server finishes open requests and the hourly job within 25 seconds of SIGTERM.
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - coolify
      - backend

  db2:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: agentsplit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB2_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep the data in a version folder under /var/lib/postgresql.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentsplit']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      backend:
        # A name no other stack uses: the app also sits on the shared coolify
        # network, where a plain service name can resolve to another stack.
        aliases: [agentsplit-db2]

  # The old app's database, unchanged and unused. Its removal is approved for 2026-11-13; keep the volume.
  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: agentsplit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentsplit']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_UPLOAD_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_UPLOAD_SECRET}
      GARAGE_DEFAULT_BUCKET: agentsplit-receipts
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      coolify: {}
      backend:
        # A name no other stack uses: the app also sits on the shared coolify
        # network, where a plain service name can resolve to another stack.
        aliases: [agentsplit-garage]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify

      # The host names below are the maintainer's production domains: the S3
      # API of this Garage and the app's origin. Another deployment sets its own.
      # Preserve the signed Host and full path for authenticated S3 uploads.
      traefik.http.routers.agentsplit-s3.rule: Host(`agentsplit-receipts.freemanjiang.com`)
      traefik.http.routers.agentsplit-s3.entrypoints: https
      traefik.http.routers.agentsplit-s3.tls: 'true'
      traefik.http.routers.agentsplit-s3.tls.certresolver: letsencrypt
      traefik.http.routers.agentsplit-s3.priority: '10'
      traefik.http.routers.agentsplit-s3.service: agentsplit-s3
      traefik.http.routers.agentsplit-s3.middlewares: agentsplit-storage-cors
      traefik.http.services.agentsplit-s3.loadbalancer.server.port: '3900'

      # Preflights are answered by Traefik. Only the app origin may upload
      # through the browser; no public-write or public-list bucket permission.
      traefik.http.middlewares.agentsplit-storage-cors.headers.accesscontrolalloworiginlist: https://agentsplit.freemanjiang.com
      traefik.http.middlewares.agentsplit-storage-cors.headers.accesscontrolallowmethods: GET,HEAD,PUT,POST,OPTIONS
      traefik.http.middlewares.agentsplit-storage-cors.headers.accesscontrolallowheaders: '*'
      traefik.http.middlewares.agentsplit-storage-cors.headers.accesscontrolexposeheaders: ETag
      traefik.http.middlewares.agentsplit-storage-cors.headers.addvaryheader: 'true'

volumes:
  postgres18-data:
  postgres-data:
  garage-meta:
  garage-data:

networks:
  coolify:
    external: true
  backend:
    internal: true
