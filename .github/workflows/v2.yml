name: v2

on:
  push:
    branches: ['v2']
    paths: ['v2/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml']

# The checks only read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    services:
      postgres:
        # PostgreSQL 18 as on apps-pg; the image runs in UTC, as the tests require.
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5437/agentsplit_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # The differential tests load the current app's code from ../src.
      - name: Install the current app's dependencies for the differential tests
        working-directory: .
        run: npm ci --ignore-scripts && npx prisma generate
      - name: Check types
        run: bun run check-types
      - name: Tests
        run: bun run test
      - name: Production build
        run: bunx vite build
