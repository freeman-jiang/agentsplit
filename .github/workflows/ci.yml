name: CI

on:
  push:
    branches: ['main', 'codex/mcp']
  pull_request:
    branches: ['main']

# Least privilege: the checks only read the repository. Without an explicit
# block, the workflow runs with the repository's default token scopes, which
# for many repositories includes write access.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      POSTGRES_PRISMA_URL: postgresql://postgres:agentsplit-ci-only@127.0.0.1:5432/agentsplit_audit_test
      POSTGRES_URL_NON_POOLING: postgresql://postgres:agentsplit-ci-only@127.0.0.1:5432/agentsplit_audit_test

    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agentsplit-ci-only
          POSTGRES_DB: agentsplit_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentsplit_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile runtime and ships npm >= 11. npm 10 rejects
          # lockfiles written by npm >= 11, which is what Dependabot uses.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check TypeScript types
        run: npm run check-types

      - name: Lint (oxlint)
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run check-formatting

      - name: Run tests
        run: npm test

      - name: Set up disposable integration database
        run: node node_modules/prisma/build/index.js migrate deploy

      - name: Verify audit transactions and currency accounting
        run: node node_modules/tsx/dist/cli.mjs scripts/test-expense-history.ts
