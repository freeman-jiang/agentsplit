name: CI

on:
  push:
    branches: ['main']
  pull_request:

# The checks only read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every step runs in the dev shell of flake.nix, as on the dev box: the same Bun,
      # PostgreSQL 18, Chromium and docker-compose, and the same PG* settings and db-reset.
      - uses: cachix/install-nix-action@v31
      - name: Start PostgreSQL
        run: nix develop --command db-start
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      # The build also generates the route tree (src/client/routeTree.gen.ts) that the type check needs.
      - name: Production build
        run: nix develop --command bun run build
      - name: Client bundle budget
        run: nix develop --command bun scripts/check-bundle.ts
      - name: Check types
        run: nix develop --command bun run check-types
      - name: The Drizzle schema matches the migrations
        run: |
          nix develop --command bunx drizzle-kit generate --name drift
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then echo "db/schema differs from db/migrations: run drizzle-kit generate" >&2; exit 1; fi
      - name: The Better Auth schema is generated
        run: |
          nix develop --command bun scripts/gen-auth-schema.ts
          git diff --exit-code -- db/schema/auth.ts
      - name: Tests
        run: nix develop --command bun run test
      # Ubuntu 24 runners block unprivileged user namespaces, which the Chromium sandbox needs.
      # The tests keep the sandbox on, so allow them on this throwaway runner.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests against the production build
        run: nix develop --command env SKIP_BUILD=1 ./scripts/e2e.sh
      - name: End-to-end tests against the image and the Coolify stack
        run: nix develop --command ./scripts/e2e.sh --compose
