<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
    <title>Offline · AgentSplit</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      /* The app's monochrome tokens (src/client/styles.css), repeated here because
         this page loads none of the app's files. */
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #0d0d0d;
        --muted-foreground: #666666;
        --primary: #0d0d0d;
        --primary-foreground: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #141414;
          --foreground: #ededed;
          --muted-foreground: #a3a3a3;
          --primary: #fafafa;
          --primary-foreground: #0d0d0d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: max(2rem, env(safe-area-inset-top)) max(2rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom))
          max(2rem, env(safe-area-inset-left));
        text-align: center;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: var(--background);
        color: var(--foreground);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand span {
        width: 2.5rem;
        height: 2rem;
        background: currentColor;
        mask: url('/brand-mark.svg') center / contain no-repeat;
        -webkit-mask: url('/brand-mark.svg') center / contain no-repeat;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted-foreground);
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        min-height: 44px;
        padding: 0 1.25rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--primary-foreground);
        background: var(--primary);
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        transition: scale 150ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active {
        scale: 0.97;
      }
      @media (hover: hover) {
        button:hover {
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="brand" role="img" aria-label="AgentSplit"><span></span>AgentSplit</div>
    <h1>You're offline</h1>
    <p>
      This page isn't available without a connection. Pages and data you've
      already visited may still work. Reconnect and try again.
    </p>
    <button id="retry" type="button">Try again</button>
    <script src="/offline.js"></script>
  </body>
</html>
